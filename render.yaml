services:
  - type: web
    name: edusuivi
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /EduSuivi/login.jsp
    envVars:
      - key: EDUSUIVI_DB_URL
        sync: false
      - key: EDUSUIVI_DB_USER
        sync: false
      - key: EDUSUIVI_DB_PASSWORD
        sync: false
