<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Accès Refusé (403) - EduSuivi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
    </style>
</h:head>
<h:body>
    <div class="card shadow-sm border-0 p-5 text-center" style="max-width: 500px; border-radius: 16px;">
        <div class="text-danger mb-3">
            <i class="bi bi-shield-slash-fill fs-1"></i>
        </div>
        <h3 class="fw-bold text-danger">Accès Non Autorisé (403)</h3>
        <p class="text-muted mt-2">
            La politique de sécurité JAAS du conteneur ne vous autorise pas à accéder à cette ressource avec votre rôle actuel.
        </p>
        <div class="d-flex justify-content-center gap-2 mt-4">
            <h:link outcome="/auth/login.xhtml" styleClass="btn btn-outline-secondary">
                <i class="bi bi-box-arrow-in-left me-1"></i> Se reconnecter
            </h:link>
            <h:link outcome="#{authBean.redirectToRoleDashboard(authBean.currentRole)}" styleClass="btn btn-primary">
                <i class="bi bi-speedometer2 me-1"></i> Mon tableau de bord
            </h:link>
        </div>
    </div>
</h:body>
</html>
