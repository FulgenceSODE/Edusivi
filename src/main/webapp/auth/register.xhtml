<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Demande d'inscription Enseignant - EduSuivi Universitaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0369a1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .register-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 580px;
        }
    </style>
</h:head>
<h:body>
    <div class="register-card">
        <div class="bg-primary text-white p-4 text-center">
            <i class="bi bi-person-plus-fill fs-1 text-white mb-2"></i>
            <h4 class="fw-bold mb-1">Demande d'inscription Enseignant</h4>
            <p class="text-white-50 small mb-0">Création de compte Professeur soumis à la validation de l'Administrateur</p>
        </div>

        <div class="p-4 p-sm-5">
            <h:form id="registerForm">
                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label class="form-label small fw-bold text-muted">Nom *</label>
                        <input type="text" class="form-control" placeholder="Ex: Kouamé" required="required"/>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label small fw-bold text-muted">Prénom *</label>
                        <input type="text" class="form-control" placeholder="Ex: Koffi" required="required"/>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Email Académique *</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" placeholder="enseignant@univ.ci" required="required"/>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Discipline / Spécialité *</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-mortarboard"></i></span>
                        <input type="text" class="form-control" placeholder="Ex: Informatique, Mathématiques, Réseaux" required="required"/>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-sm-6">
                        <label class="form-label small fw-bold text-muted">Mot de passe *</label>
                        <input type="password" class="form-control" required="required"/>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label small fw-bold text-muted">Confirmer le mot de passe *</label>
                        <input type="password" class="form-control" required="required"/>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="button" class="btn btn-primary btn-lg fw-semibold" onclick="alert('Votre demande d\'inscription a été soumise avec succès ! Elle sera examinée par l\'administrateur.'); window.location.href='login.xhtml';">
                        Soumettre la demande
                    </button>
                </div>

                <div class="text-center mt-3 pt-3 border-top">
                    <span class="text-muted small">Vous avez déjà un compte ? </span>
                    <h:link outcome="/auth/login.xhtml" styleClass="small fw-bold text-decoration-none text-primary">
                        Se connecter
                    </h:link>
                </div>
            </h:form>
        </div>
    </div>
</h:body>
</html>
