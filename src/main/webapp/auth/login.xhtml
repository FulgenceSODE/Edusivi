<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Connexion JAAS - EduSuivi Universitaire</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0369a1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 480px;
        }
        .login-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%);
            padding: 2.25rem 2rem;
            text-align: center;
            color: #ffffff;
        }
        .role-btn {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .role-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</h:head>
<h:body>
    <div class="login-card">
        <!-- En-tête -->
        <div class="login-header">
            <div class="d-inline-flex p-3 rounded-circle bg-white bg-opacity-20 mb-3">
                <i class="bi bi-mortarboard-fill fs-1 text-white"></i>
            </div>
            <h3 class="fw-bold mb-1">EduSuivi</h3>
            <p class="text-white-50 mb-0 small">Système de suivi de cours et évaluations scolaires</p>
        </div>

        <!-- Corps du formulaire de connexion JAAS -->
        <div class="p-4 p-sm-5">
            <h5 class="fw-semibold text-secondary mb-3 text-center">Authentification JAAS</h5>

            <!-- Messages d'erreur / info Faces -->
            <h:messages globalOnly="true" infoClass="alert alert-success py-2 small"
                        errorClass="alert alert-danger py-2 small"
                        warnClass="alert alert-warning py-2 small"
                        styleClass="list-unstyled mb-3"/>

            <h:form id="loginForm">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Adresse Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                        <h:inputText id="email" value="#{authBean.email}"
                                     styleClass="form-control border-start-0 ps-0"
                                     required="true" requiredMessage="L'email est requis."/>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                        <h:inputSecret id="password" value="#{authBean.password}"
                                       styleClass="form-control border-start-0 ps-0"
                                       required="true" requiredMessage="Le mot de passe est requis."/>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <h:commandButton value="Se connecter" action="#{authBean.login}"
                                     styleClass="btn btn-primary btn-lg fw-semibold shadow-sm"/>
                </div>

                <!-- Liens supplémentaires -->
                <div class="text-center mt-3 pt-3 border-top">
                    <span class="text-muted small">Vous êtes enseignant ? </span>
                    <h:link outcome="/auth/register.xhtml" styleClass="small fw-bold text-decoration-none text-primary">
                        S'inscrire (Demande d'inscription)
                    </h:link>
                </div>
            </h:form>

            <!-- Accès rapide de démonstration par Rôle JAAS -->
            <div class="mt-4 p-3 bg-light rounded-3 border">
                <div class="text-muted small fw-bold mb-2 text-center text-uppercase" style="font-size: 0.72rem;">
                    <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Accès Démo Rapide par Rôle
                </div>
                <h:form styleClass="d-flex justify-content-between gap-2">
                    <h:commandLink action="#{authBean.switchRole('DE')}" styleClass="btn btn-sm btn-outline-primary w-100 role-btn">
                        <i class="bi bi-person-badge d-block mb-1"></i> Dir. Études
                    </h:commandLink>
                    <h:commandLink action="#{authBean.switchRole('PROFESSEUR')}" styleClass="btn btn-sm btn-outline-success w-100 role-btn">
                        <i class="bi bi-mortarboard d-block mb-1"></i> Professeur
                    </h:commandLink>
                    <h:commandLink action="#{authBean.switchRole('ADMIN')}" styleClass="btn btn-sm btn-outline-danger w-100 role-btn">
                        <i class="bi bi-shield-lock d-block mb-1"></i> Admin
                    </h:commandLink>
                </h:form>
            </div>
        </div>
    </div>
</h:body>
</html>
