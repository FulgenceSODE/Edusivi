<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title><ui:insert name="title">EduSuivi Universitaire</ui:insert></title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <!-- Custom Theme Styling -->
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-dark: #172554;
            --accent-color: #0284c7;
            --sidebar-width: 270px;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            min-height: 100vh;
        }
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .content-body {
            flex: 1;
            padding: 2rem;
        }
        .nav-link {
            color: #94a3b8 !important;
            padding: 0.75rem 1.25rem;
            font-weight: 500;
            border-radius: 8px;
            margin: 0.2rem 0.75rem;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
        }
        .nav-link i {
            font-size: 1.15rem;
            margin-right: 0.75rem;
        }
        .nav-link:hover, .nav-link.active {
            color: #ffffff !important;
            background-color: rgba(2, 132, 199, 0.25);
            border-left: 4px solid var(--accent-color);
        }
        .card-stat {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-stat:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }
        .badge-role-admin { background-color: #dc2626; color: white; }
        .badge-role-de { background-color: #2563eb; color: white; }
        .badge-role-prof { background-color: #059669; color: white; }
        .table-custom th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
        }
    </style>
</h:head>
<h:body>
    <!-- Barre latérale / Sidebar -->
    <ui:include src="/layout/sidebar.xhtml"/>

    <!-- Conteneur principal -->
    <div class="main-content">
        <!-- Barre de navigation supérieure / Header -->
        <ui:include src="/layout/header.xhtml"/>

        <!-- Corps de page -->
        <main class="content-body">
            <!-- Messages globaux Faces (Succès, Erreurs, Validations) -->
            <div class="container-fluid px-0 mb-3">
                <h:messages globalOnly="true" infoClass="alert alert-success d-flex align-items-center mb-3"
                            errorClass="alert alert-danger d-flex align-items-center mb-3"
                            warnClass="alert alert-warning d-flex align-items-center mb-3"
                            styleClass="list-unstyled mb-0"/>
            </div>

            <!-- Insertion du contenu de la vue spécifique -->
            <ui:insert name="content"/>
        </main>

        <!-- Pied de page / Footer -->
        <ui:include src="/layout/footer.xhtml"/>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
