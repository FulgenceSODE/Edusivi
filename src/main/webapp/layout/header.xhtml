<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<ui:composition>
    <header class="navbar navbar-expand-lg bg-white border-bottom shadow-sm px-4 py-2 sticky-top">
        <div class="container-fluid px-0">
            <!-- Fil d'Ariane & Titre de contexte -->
            <div class="d-flex align-items-center">
                <span class="badge bg-light text-primary border me-3 py-2 px-3">
                    <i class="bi bi-calendar3 me-1"></i> Année : <strong>#{authBean.activeAcademicYear}</strong>
                </span>
                <span class="badge bg-light text-secondary border py-2 px-3">
                    <i class="bi bi-clock-history me-1"></i> <strong>#{authBean.activeSemester}</strong>
                </span>
            </div>

            <!-- Contrôles utilisateur & Sécurité JAAS -->
            <div class="d-flex align-items-center gap-3">
                <!-- Sélecteur rapide de rôle (Bascule de profil JAAS) -->
                <h:form styleClass="d-inline-flex align-items-center mb-0">
                    <span class="text-muted small me-2 d-none d-md-inline">Rôle actif :</span>
                    <div class="btn-group btn-group-sm" role="group">
                        <h:commandLink action="#{authBean.switchRole('DE')}"
                                       styleClass="btn #{authBean.currentRole == 'DE' ? 'btn-primary' : 'btn-outline-primary'}">
                            DE
                        </h:commandLink>
                        <h:commandLink action="#{authBean.switchRole('PROFESSEUR')}"
                                       styleClass="btn #{authBean.currentRole == 'PROFESSEUR' ? 'btn-success' : 'btn-outline-success'}">
                            Professeur
                        </h:commandLink>
                        <h:commandLink action="#{authBean.switchRole('ADMIN')}"
                                       styleClass="btn #{authBean.currentRole == 'ADMIN' ? 'btn-danger' : 'btn-outline-danger'}">
                            Admin
                        </h:commandLink>
                    </div>
                </h:form>

                <!-- Séparateur vertical -->
                <div class="vr my-1"></div>

                <!-- Informations profil connecté -->
                <div class="d-flex align-items-center">
                    <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 38px; height: 38px; font-weight: bold;">
                        #{authBean.nomComplet.substring(0, 1)}
                    </div>
                    <div class="d-none d-lg-block text-start me-3">
                        <div class="fw-semibold small text-truncate" style="max-width: 180px;">#{authBean.nomComplet}</div>
                        <span class="badge #{authBean.currentRole == 'ADMIN' ? 'badge-role-admin' : (authBean.currentRole == 'DE' ? 'badge-role-de' : 'badge-role-prof')}">
                            #{authBean.currentRole}
                        </span>
                    </div>
                </div>

                <!-- Bouton de déconnexion JAAS -->
                <h:form styleClass="mb-0">
                    <h:commandLink action="#{authBean.logout}" styleClass="btn btn-outline-danger btn-sm" title="Déconnexion JAAS">
                        <i class="bi bi-box-arrow-right me-1"></i>
                        <span class="d-none d-sm-inline">Déconnexion</span>
                    </h:commandLink>
                </h:form>
            </div>
        </div>
    </header>
</ui:composition>
</html>
